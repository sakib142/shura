# Shura configuration.
#
# Committed to the repository. Credentials are NAMED here, never carried —
# every *Env field is the name of an environment variable, and the values live
# in .env, which is gitignored. Shura refuses to load a config containing
# anything shaped like a live token.

project: agent-hub

# Where the code lives.
repo:
  type: github
  owner: sakib142
  name: forge-sandbox
  base: main
  checks: ["sh", "-c", "pnpm install --prefer-offline --silent >/dev/null 2>&1 && pnpm exec vitest run"]
  tokenEnv: GITHUB_TOKEN

  # To work against a real GitHub repository instead:
  # type: github
  # owner: your-account
  # name: your-repo
  # base: main
  # checks: ["pnpm", "test"]
  # tokenEnv: GITHUB_TOKEN

# Where work items live. "local" keeps them in Postgres and needs no account.
tracker:
  type: jira
  site: https://sakib142.atlassian.net
  project: KAN
  emailEnv: JIRA_EMAIL
  tokenEnv: JIRA_API_TOKEN

  # type: jira
  # site: https://your-org.atlassian.net
  # project: PORTAL
  # emailEnv: JIRA_EMAIL
  # tokenEnv: JIRA_API_TOKEN
  # statusMap:
  #   in_review: "Code Review"
  #   accepted: "PO Accepted"

# Which model runs each role.
#
# The producer and its verifier MUST be different vendors. Shura checks this
# when it schedules the verification and refuses before spending anything.
agents:
  # Three positions, one flow. The planner and the builder run on anthropic and
  # the reviewer on openai, because rule 1 requires the reviewer to be a
  # different vendor from the builder and Shura refuses the pair before
  # spending anything if they are not.
  #
  # What kind of codebase they are working on is not a role — pass --domain.
  planner:
    runtime: anthropic
    model: default
  builder:
    runtime: anthropic
    model: default
  reviewer:
    runtime: openai
    model: default

  backlog-author:
    runtime: anthropic
    model: default
  backlog-reviewer:
    runtime: openai
    model: default

# Ceilings. A run stops at these rather than asking forgiveness.
#
# The effective limit is the LOWER of these and the role's own, so lowering
# per_task_usd here caps every agent hard. Cost is driven by input tokens —
# the transcript is re-sent every turn — so a repository the agent has to read
# a lot of costs more than a focused change to a file it was pointed at.
# Prompt caching makes the re-sending cheap; a narrow request makes it small.
budgets:
  per_task_usd: 5
  per_task_tokens: 2000000
  per_task_minutes: 30
  loop_cap: 3
