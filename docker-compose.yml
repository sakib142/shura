services:
  postgres:
    image: postgres:17-alpine
    container_name: shura-postgres
    environment:
      POSTGRES_USER: shura
      POSTGRES_PASSWORD: shura
      POSTGRES_DB: shura
    ports:
      - "5440:5432"
    volumes:
      - shura-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shura -d shura"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  shura-pgdata:
