id: code-reviewer
kind: verify
model:
  runtime: openai
  model: gpt-6.1-sol
  # must stay a different vendor from the producer
  fallback: google/gemini-3.8-flash
tools: [repo.read, test.run, verdict.submit]
limits: { max_minutes: 30, max_tokens: 400000, max_usd: 2.00 }
instructions: prompts/code-reviewer.md
output: { verdict: required }
never: [repo.write, repo.merge, claims.claim]
